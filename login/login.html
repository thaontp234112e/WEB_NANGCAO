<div class="container mt-4">
  <div class="card" style="width: 22rem;">
    <div class="card-header">Login System</div>
    <div class="card-body">

      <!-- Cookie info -->
      <div *ngIf="cookieInfo" class="alert alert-success">
        <strong>Welcome back!</strong><br>
        Username: <b>{{ cookieInfo.username }}</b><br>
        Full name: <b>{{ cookieInfo.fullname || 'N/A' }}</b><br>
        Email: <b>{{ cookieInfo.email || 'N/A' }}</b>
      </div>

      <!-- Error -->
      <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>

      <div class="mb-3">
        <label class="form-label">User Name:</label>
        <input type="text" class="form-control" [(ngModel)]="username" name="username">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" [(ngModel)]="password" name="password">
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" (click)="doLogin()">Login</button>
        <button class="btn btn-outline-secondary" (click)="doLogout()">Logout</button>
      </div>

    </div>
  </div>
</div>
