<div class="search-bar">

<input
type="text"
placeholder="Search Fashion"
[(ngModel)]="keyword"
/>

<button (click)="search()">SEARCH</button>

</div>


<div class="fashion-grid">

<div
class="fashion-card"
*ngFor="let fashion of filteredFashions"
>

<img
[src]="fashion.fashion_image"
(click)="show_detail(fashion._id)"
/>

<p>{{fashion.fashion_subject}}</p>

</div>

</div>
